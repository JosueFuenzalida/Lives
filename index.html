<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RopasLive - Panel de Control</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <style>
        /* PALETAS DE COLORES PREMIUM (FONDOS SUTILES OSCURECIDOS) */
        :root {
            --bg-color: #f4f6f8; 
            --card-bg: #ffffff;
            --accent-color: #2980b9;
            --text-color: #2c3e50;
            --input-border: #dfe6e9;
            --muted-text: #7f8c8d;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --radius: 16px;
        }

        [data-theme="verde"] {
            --bg-color: #f0f2f0; 
            --card-bg: #ffffff;
            --accent-color: #16a085;
            --text-color: #2c3e50;
            --input-border: #dcdde1;
            --muted-text: #7f8c8d;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        [data-theme="oscuro"] {
            --bg-color: #131419;
            --card-bg: #1c1d24;
            --accent-color: #3498db;
            --text-color: #f5f6fa;
            --input-border: #2c2d35;
            --muted-text: #a4b0be;
            --shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* BARRA SUPERIOR (ESQUEMA: PANEL DE ESTADO LIVE) */
        .top-bar {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--input-border);
            box-shadow: var(--shadow);
            z-index: 10;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-indicator {
            width: 10px;
            height: 10px;
            background-color: #e74c3c;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.4; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        .live-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn-close-live {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-close-live:hover {
            background: #e74c3c;
            color: white;
        }

        /* CONTENEDOR PRINCIPAL ESCALADO */
        .content-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .view {
            display: none !important;
        }

        .view.active {
            display: block !important;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* TARJETAS ESTILIZADAS CON BORDES REDONDEADOS PRO */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        /* FORMULARIOS MODERNOS */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--muted-text);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        /* EL DISPLAY GIGANTE DEL CÓDIGO ACTUAL QUE ME PEDISTE */
        .code-display-box {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #ffffff;
            padding: 25px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .code-display-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .code-display-value {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            font-family: monospace;
        }

        /* LOS 4 MACRO-BOTONES TÁCTILES DEL ESQUEMA */
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-macro {
            background-color: var(--card-bg);
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 25px 15px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-macro:active {
            transform: scale(0.95);
        }

        .btn-macro.active {
            border: 2px solid var(--accent-color) !important;
            background-color: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(41, 128, 185, 0.15);
            color: var(--accent-color);
        }

        .btn-macro span {
            font-size: 32px;
        }

        /* BOTONES DE DISPARO DE ACCIÓN COMPACTOS */
        .btn-primary {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.3);
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.9;
        }

        /* ACORDEONES ELEGANTES PARA CLIENTES */
        .client-card {
            background-color: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .client-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
        }

        .client-content {
            display: none;
            padding: 16px;
            background-color: rgba(0,0,0,0.01);
            border-top: 1px solid var(--input-border);
        }

        /* BOTÓN FLOTANTE (+) ACCESIBLE */
        .fab {
            position: fixed;
            right: 25px;
            bottom: 100px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #2ecc71;
            color: white;
            border: none;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 16px rgba(46, 204, 113, 0.4);
            cursor: pointer;
            z-index: 99;
        }

        /* NAVEGACIÓN INFERIOR PREMIUM */
        .navigation-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: var(--card-bg);
            border-top: 1px solid var(--input-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.03);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--muted-text);
            font-weight: 700;
            background: none;
            border: none;
            cursor: pointer;
            width: 25%;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-link.active {
            color: var(--accent-color);
        }

        .nav-link svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="live-status">
            <div id="live-dot" class="live-indicator"></div>
            <span id="live-title-display" class="live-title">MODO ESPERA</span>
        </div>
        <button id="btn-top-session" class="btn-close-live" style="display: none;">TERMINAR LIVE</button>
    </div>

    <div class="content-container">

        <div id="view-inicio" class="view active">
            <div class="card" style="margin-top: 15px;">
                <h2 style="text-align: center; margin-bottom: 20px; font-weight: 800;">Consola RopasLive</h2>
                <div class="form-group">
                    <label>Identificador del Directo</label>
                    <input type="text" id="init-live-name" class="form-control" placeholder="Ej: LIVE DE HOY">
                </div>
                <div class="form-group">
                    <label>Nota o Descripción de Perchero</label>
                    <input type="text" id="init-live-comment" class="form-control" placeholder="Ej: Faldones y Poleras Premium">
                </div>
                <button id="btn-start-live" class="btn-primary" style="margin-top: 10px;">ABRIR PANEL DE TRANSMISIÓN</button>
            </div>
        </div>

        <div id="view-venta" class="view">
            
            <div class="code-display-box">
                <div class="code-display-title">Código Prenda Actual</div>
                <div id="code-display-realtime" class="code-display-value">----</div>
            </div>

            <div class="form-group" id="manual-code-group">
                <label>Ajustar Código Manual</label>
                <input type="text" id="venta-codigo" class="form-control" style="text-align: center; font-weight: bold; font-family: monospace;">
            </div>

            <div class="form-group">
                <label>1. Presionar Prenda Seleccionada</label>
                <div id="prendas-container" class="macro-grid">
                    </div>
            </div>

            <div class="card" style="padding: 15px; border-radius: 12px;">
                <div class="form-group">
                    <label>2. Clienta Ganadora</label>
                    <select id="venta-clienta" class="form-control" style="font-weight: bold;">
                        </select>
                </div>

                <div class="form-group" style="margin-bottom: 5px;">
                    <label>3. Valor Adjudicado ($)</label>
                    <input type="number" id="venta-precio" class="form-control" placeholder="Ej: 5000" style="font-size: 18px; font-weight: bold;">
                </div>
            </div>

            <button id="btn-registrar-imprimir" class="btn-primary" style="font-size: 18px; background-color: #27ae60; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);">⚡ GUARDAR Y ENVIAR A IMPRESORA</button>
        </div>

        <div id="view-clientes" class="view">
            <div class="form-group">
                <input type="text" id="search-clientes" class="form-control" placeholder="🔍 Filtrar clientas al instante...">
            </div>
            <div id="clientes-list">
                </div>
            <button id="fab-add-cliente" class="fab">+</button>
        </div>

        <div id="view-informes" class="view">
            <div class="form-group">
                <label>Seleccionar Historial de Live</label>
                <select id="informe-live-select" class="form-control"></select>
            </div>

            <div class="card" style="padding: 12px;">
                <textarea id="informe-text-out" class="form-control" rows="12" style="font-family: monospace; font-size: 13px; resize: none; background: rgba(0,0,0,0.02);" readonly></textarea>
            </div>

            <button id="btn-copy-text" class="btn-primary" style="background-color: #34495e; box-shadow: none; margin-bottom: 10px;">📋 COPIAR TEXTO COMPLETO</button>
            <button id="btn-share-whatsapp" class="btn-primary" style="background-color: #25D366; box-shadow: none;">💬 DESPACHAR A WHATSAPP</button>
        </div>

        <div id="view-ajustes" class="view">
            <div class="card">
                <label class="form-group"><input type="radio" name="theme-opt" value="azul" checked> Azul Ejecutivo</label>
                <label class="form-group"><input type="radio" name="theme-opt" value="verde"> Verde Oliva</label>
                <label class="form-group"><input type="radio" name="theme-opt" value="oscuro"> Modo Noche</label>
            </div>

            <div class="card">
                <h3 style="font-size: 13px; margin-bottom: 10px; color: var(--muted-text);">MECANISMO DE ETIQUETADO</h3>
                <label style="display:block; margin-bottom: 8px;"><input type="radio" name="codigo-mode" value="manual" checked> Manual (Escribir Códigos antes)</label>
                <label style="display:block;"><input type="radio" name="codigo-mode" value="auto"> Automático (Generar en el Live)</label>
            </div>

            <div class="card">
                <h3 style="font-size: 13px; margin-bottom: 10px; color: var(--muted-text);">PERSONALIZAR LOS 4 BOTONES RÁPIDOS</h3>
                <div id="config-botones-list"></div>
                <button id="btn-save-botones" class="btn-primary" style="margin-top: 10px; padding: 10px; font-size: 14px;">Actualizar Botones</button>
            </div>

            <div class="card">
                <button id="btn-export-backup" class="btn-primary" style="background-color: #7f8c8d; box-shadow:none; margin-bottom: 10px; font-size: 13px;">📥 Descargar Copia Backup (.JSON)</button>
                <button id="btn-import-backup" class="btn-primary" style="background-color: #7f8c8d; box-shadow:none; font-size: 13px;">📤 Cargar Respaldo anterior</button>
                <input type="file" id="file-import-input" style="display: none;" accept=".json">
            </div>
        </div>

    </div>

    <nav class="navigation-bar">
        <button class="nav-link active" data-target="view-inicio">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            Inicio
        </button>
        <button class="nav-link" data-target="view-venta" id="nav-btn-venta">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            Venta
        </button>
        <button class="nav-link" data-target="view-clientes">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3 Competitor"/></svg>
            Clientes
        </button>
        <button class="nav-link" data-target="view-informes">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            Informe
        </button>
    </nav>

    <script src="js/main.js"></script>
    <script src="js/ventas.js"></script>
    <script src="js/clientes.js"></script>
    <script src="js/informes.js"></script>
    <script src="js/ajustes.js"></script>
</body>
</html>
